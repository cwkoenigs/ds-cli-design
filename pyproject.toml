[project]
name = "ds-cli-design"
version = "1.0.0"
description = "The ds-next terminal design system as a project: the full design export, a Python library (Rich + prompt_toolkit), and agent skills"
requires-python = ">=3.10"
dependencies = ["rich>=13", "prompt_toolkit>=3.0"]

[project.scripts]
ds-cli-design-demo = "ds_cli_design.demo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ds_cli_design"]
